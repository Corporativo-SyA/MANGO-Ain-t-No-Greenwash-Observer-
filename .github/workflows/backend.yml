name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias (versiones exactas de uv.lock)
        run: uv sync --python 3.12 --locked

      - name: Linter
        run: uv run ruff check .

      - name: Pruebas
        run: uv run pytest -q

      - name: El contrato JSON está sincronizado con app/contrato.py
        run: |
          uv run python scripts/exportar_contrato.py
          git diff --exit-code -- api_contract.json \
            || (echo "::error::api_contract.json desactualizado: corre 'python scripts/exportar_contrato.py' y sube los cambios" && exit 1)
