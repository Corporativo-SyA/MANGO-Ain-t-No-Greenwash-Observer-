[project]
name = "backend-manglares"
version = "0.2.0"
description = "Backend local del MVP Detector de Tendencias e Impacto en Manglares"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "requests>=2.31",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "ruptures>=1.1.9",
    "affine>=3",
    "attrs>=24",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pydantic.PydanticDeprecatedSince20"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Copia intacta del pipeline original validado (solo referencia y regresión): no se modifica
extend-exclude = ["app/pipeline/mango_v1_referencia.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
